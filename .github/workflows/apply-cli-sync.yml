name: Apply CLI sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cli-sync.yml'

permissions:
  contents: write

jobs:
  apply-cli-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore synced CLI
        shell: python
        run: |
          import base64
          import gzip
          from pathlib import Path
          data = """"""
          Path("src/anime_studio/cli.py").write_bytes(gzip.decompress(base64.b64decode(data)))
          Path(".github/workflows/apply-cli-sync.yml").unlink(missing_ok=True)
      - name: Commit restored CLI
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No CLI sync changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/anime_studio/cli.py .github/workflows/apply-cli-sync.yml
          git commit -m "Sync CLI after Phase 7 finish"
          git push
