[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-anime-studio"
version = "0.1.0"
description = "Lightweight local prototype tools for AI Anime Studio."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
anime-studio = "anime_studio.cli:main"
anime-storyboard = "anime_studio.storyboard_cli:main"

[tool.setuptools.packages.find]
where = ["src"]