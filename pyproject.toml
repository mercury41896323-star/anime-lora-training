[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-anime-studio"
version = "0.1.0"
description = "Lightweight local prototype tools for AI Anime Studio."
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0.0"]

[project.scripts]
anime-studio = "anime_studio.cli:main"
anime-storyboard = "anime_studio.storyboard_cli:main"
anime-edit-preview = "anime_studio.edit_preview:main"
anime-edit-export = "anime_studio.edit_export:main"
anime-timeline-revision = "anime_studio.timeline_revision:main"
anime-training-readiness = "anime_studio.training_readiness:main"
anime-video-import = "anime_studio.video_importer:main"
anime-video-training = "anime_studio.video_training_pipeline:main"
anime-character-bootstrap = "anime_studio.character_bootstrap:main"
anime-video-analysis = "anime_studio.video_analysis:main"
anime-character-sheet-draft = "anime_studio.character_sheet_draft:main"
anime-video-shot = "anime_studio.video_shot_pipeline:main"
anime-character-master = "anime_studio.character_master_asset:main"
anime-character-2p5d = "anime_studio.character_2p5d_definition:main"
anime-video-phase35 = "anime_studio.video_phase35_pipeline:main"
anime-video-clean-frames = "anime_studio.video_frame_cleaner:main"
anime-video-domain-datasets = "anime_studio.video_domain_datasets:main"
anime-character-sheet-import = "anime_studio.character_sheet_importer:main"
anime-dataset-builder-v2 = "anime_studio.dataset_builder_v2:main"

[tool.setuptools.packages.find]
where = ["src"]
